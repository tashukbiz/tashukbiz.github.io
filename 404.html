<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <script>
      // GitHub Pages has no rewrite layer, and URL paths are case-sensitive, so
      // /Example and /example are different URLs. GitHub falls back to this page
      // for any path on this site that matches no repository, and repo names
      // here are lower-case, so a mixed-case path is worth one retry in lower
      // case. An already lower-case path renders this page, so it cannot loop.
      (function () {
        var path = window.location.pathname;
        var lowerCased = path.toLowerCase();
        if (lowerCased !== path) {
          window.location.replace(lowerCased + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        padding: 2rem;
        font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>Nothing lives at this address.</p>
  </body>
</html>
